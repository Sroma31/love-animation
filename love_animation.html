<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>I Love You — Heart Animation</title>
  <style>
    :root {
      --bg: #050508;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      font-family: Arial, Helvetica, sans-serif;
      touch-action: none;
    }

    /*
      3D stage: the canvas is tilted slightly to the right so the heart
      gets a sense of depth. The perspective container does the heavy lifting.
    */
    .stage {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      perspective: 900px;
    }

    canvas {
      display: block;
      transform: rotateY(-18deg) rotateZ(-2deg);
      filter: drop-shadow(0 0 40px rgba(65, 105, 225, 0.35));
      cursor: pointer;
    }

    /* Gentler tilt on phones so the heart stays inside the screen. */
    @media (max-width: 600px) {
      canvas {
        transform: rotateY(-8deg) rotateZ(-1deg);
      }
    }

    .hint {
      position: fixed;
      bottom: 1.2rem;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.45);
      font-size: clamp(0.75rem, 2.5vw, 0.9rem);
      letter-spacing: 0.08em;
      text-align: center;
      pointer-events: none;
      user-select: none;
      width: 90%;
    }

    @media (prefers-reduced-motion: reduce) {
      canvas {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="heartCanvas"></canvas>
  </div>
  <p class="hint">Tap or press R to replay</p>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    const WORDS = ['love you', 'Love You', 'LOVE YOU'];
    const CENTER_TEXT = ' Love You ';
    const COLORS = [
      'rgb(70, 130, 180)',
      'rgb(30, 144, 255)',
      'rgb(0, 191, 255)',
      'rgb(100, 149, 237)',
      'rgb(65, 105, 225)',
    ];

    let width, height, centerX, centerY, SCALE;
    let particles, fillStartFrame;
    let frame = 0;
    let running = true;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      centerX = width / 2;
      centerY = height / 2;

      // Heart width = 32 * SCALE. Keep it ~75% of the smaller screen side.
      const targetScale = Math.min(width, height) / 44;
      SCALE = Math.max(7, Math.min(24, targetScale));

      // Rebuild the scene at the new size so it always fits.
      rebuildScene();
      frame = 0;
    }

    window.addEventListener('resize', () => {
      resize();
    });

    function heartXY(t) {
      const x = 16 * (Math.sin(t) ** 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return { x, y: -y };
    }

    function toScreen(x, y) {
      return {
        x: x * SCALE + centerX,
        y: y * SCALE + centerY,
      };
    }

    function dist(a, b) {
      return Math.hypot(a.x - b.x, a.y - b.y);
    }

    function randChoice(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function randRange(min, max) {
      return Math.random() * (max - min) + min;
    }

    function createParticle(x, y, order, kind) {
      return {
        x,
        y,
        order,
        kind,
        word: randChoice(WORDS),
        color: randChoice(COLORS),
        alpha: 0,
        flicker: randRange(0, Math.PI * 2),
        delay: 0,
        sizeMult: randRange(0.85, 1.15),
      };
    }

    function responsiveCounts() {
      // Fewer particles on small / low-power devices.
      const area = width * height;
      const isSmall = Math.min(width, height) < 600;
      const density = isSmall ? 0.55 : 1.0;
      return {
        outline: Math.floor(160 * density),
        fill: Math.floor(130 * density),
      };
    }

    function buildOutlineParticles(nOutline, minGap) {
      const particles = [];
      const placed = [];
      for (let i = 0; i < nOutline; i++) {
        const t = (i / nOutline) * 2 * Math.PI;
        const { x: bx, y: by } = heartXY(t);
        const pos = toScreen(bx, by);
        if (placed.some((p) => dist(pos, p) < minGap)) continue;
        placed.push(pos);
        particles.push(createParticle(pos.x, pos.y, i, 'outline'));
      }
      return particles;
    }

    function buildFillParticles(nFill, minGap) {
      const particles = [];
      const placed = [];
      let attempts = 0;
      const maxAttempts = nFill * 80;

      while (particles.length < nFill && attempts < maxAttempts) {
        attempts++;
        const t = randRange(0, 2 * Math.PI);
        const r = randRange(0, 0.86);
        const { x: bx, y: by } = heartXY(t);
        const pos = toScreen(bx * r, by * r);
        if (placed.some((p) => dist(pos, p) < minGap)) continue;
        placed.push(pos);
        particles.push(createParticle(pos.x, pos.y, Math.floor(randRange(0, 320)), 'fill'));
      }
      return particles;
    }

    function drawGlowText(word, color, x, y, alpha, sizeMult, baseFontSize) {
      if (alpha <= 0) return;

      const size = Math.max(8, Math.round(baseFontSize * sizeMult));
      ctx.font = `bold ${size}px Arial, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // Soft outer glow
      ctx.save();
      ctx.shadowColor = color;
      ctx.shadowBlur = size * 1.4;
      ctx.globalAlpha = alpha / 255;
      ctx.fillStyle = color;
      ctx.fillText(word, x, y);
      ctx.restore();

      // Crisp core text
      ctx.save();
      ctx.globalAlpha = alpha / 255;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(word, x, y);
      ctx.restore();
    }

    function rebuildScene() {
      const counts = responsiveCounts();
      // Gaps scale with the heart so particles stay evenly spaced on every screen.
      const gapScale = SCALE / 20;
      const outlineGap = 30 * gapScale;
      const fillGap = 46 * gapScale;

      const outline = buildOutlineParticles(counts.outline, outlineGap);
      const fill = buildFillParticles(counts.fill, fillGap);

      const outlineSpan = outline.length ? Math.max(...outline.map((p) => p.order)) : 0;
      const framesPerStep = 1.6;
      fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

      fill.forEach((p) => {
        p.delay = fillStartFrame + p.order;
      });
      outline.forEach((p) => {
        p.delay = Math.floor(p.order * framesPerStep);
      });

      particles = outline.concat(fill);
    }

    function render() {
      if (!running) return;

      ctx.clearRect(0, 0, width, height);
      frame++;

      const outlineFont = Math.max(12, Math.round(20 * (SCALE / 20)));
      const fillFont = Math.max(10, Math.round(17 * (SCALE / 20)));

      particles.forEach((p) => {
        if (frame > p.delay && p.alpha < 255) {
          p.alpha = Math.min(255, p.alpha + 14 + Math.floor(Math.random() * 5));
        }

        const flick = p.alpha >= 255 ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker) : 1.0;
        const alpha = Math.floor(p.alpha * flick);
        if (alpha <= 0) return;

        const fontSize = p.kind === 'outline' ? outlineFont : fillFont;
        drawGlowText(p.word, p.color, p.x, p.y, alpha, p.sizeMult, fontSize);
      });

      // Center text appears after the fill has had time to settle
      const centerStart = fillStartFrame + 200;
      if (frame > centerStart) {
        const progress = Math.min(1, (frame - centerStart) / 60);
        const centerAlpha = Math.floor(255 * (1 - Math.exp(-progress * 8)));
        const pulse = 1 + 0.025 * Math.sin(frame * 0.05);

        const baseSize = Math.max(20, Math.round(54 * (SCALE / 20)));
        const size = Math.max(1, Math.round(baseSize * pulse));

        ctx.font = `bold ${size}px Georgia, serif`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Center glow
        ctx.save();
        ctx.shadowColor = 'rgba(255, 250, 245, 0.8)';
        ctx.shadowBlur = size * 0.8;
        ctx.globalAlpha = centerAlpha / 255;
        ctx.fillStyle = 'rgb(255, 250, 245)';
        ctx.fillText(CENTER_TEXT, centerX, centerY);
        ctx.restore();

        // Center core
        ctx.save();
        ctx.globalAlpha = centerAlpha / 255;
        ctx.fillStyle = 'rgb(255, 250, 245)';
        ctx.fillText(CENTER_TEXT, centerX, centerY);
        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    function restart() {
      frame = 0;
      rebuildScene();
    }

    // Initialize
    resize();
    render();

    // Keyboard replay
    window.addEventListener('keydown', (e) => {
      if (e.key.toLowerCase() === 'r') {
        restart();
      }
    });

    // Touch / click replay
    canvas.addEventListener('pointerdown', () => {
      restart();
    });

    // Pause when tab is hidden to save resources
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        running = false;
      } else {
        running = true;
        render();
      }
    });
  </script>
</body>
</html>
